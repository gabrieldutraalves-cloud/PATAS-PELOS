<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Login.css">
    <title>Login</title>
</head>
<body>
<!--Início Cabeçalho-->
    <header class="header">
        
            <img class="header_img" src="logo.png" alt="logo">

        <nav class="nav">
            
            <Ul>
                <li><a href="http://127.0.0.1:5500/index.html">Menu</a></li>
            </Ul>
        </nav>
    </header>
<!--Fim Cabeçalho-->

<!--Início Main-->
    <main>
        
        <div class="login">
                
                <form class="login_form1">
                    <label for="email">Usuário:</label>

                        <input type="email" id="email" placeholder="Digite seu e-mail">
                </form>
        
                <form class="login_form2">
                    <label for="senha">Senha:</label>

                        <input type="password"  id="senha" placeholder="Digite sua senha">
                        
                </form>

                <button><a href="http://127.0.0.1:5500/index.html">Entrar</a></button>

                <h3>Não possui uma conta? <a href="http://127.0.0.1:5500/Cadastro/Cadastro.html">Cadastre-se</a></h3>
            
        </div>

    </main>
<!--Fim Main-->
</body>
</html>
